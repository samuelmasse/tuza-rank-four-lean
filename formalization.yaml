version: "v0.4"

project:
  name: "Tuza's Conjecture for Packing Number at Most Four"
  description: >-
    A Lean formalization of the theorem that every finite simple graph with at
    most four pairwise edge-disjoint triangles has an edge set meeting every
    triangle whose cardinality is at most twice the maximum packing size.
  authors:
    - "Samuel Masse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Samuel Masse"

