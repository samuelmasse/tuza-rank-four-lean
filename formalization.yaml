  notes: >-
    The manuscript has internal hostile and independent verification records.
    The completed Lean development, statement translation, certificate bridge,
    and final axiom report still require independent review before release.

alignment:
  namespace: "SimpleGraph"
  statements:
    - source: "Main theorem of the 2026-08-23 manuscript"
      lean: "SimpleGraph.tuza_rank_four"
      module: "Challenge"
      status: "partial"
      note: >-
        The Lean declaration is the exact inequality tau(G) <= 2 nu(G) under
        nu(G) <= 4 for arbitrary finite simple graphs; its proof is incomplete.

