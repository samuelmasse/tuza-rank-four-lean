status:
  scope: >-
    The audited definitions and exact rank-four theorem statement are present.
    The foundational extremal theory and Parker's theorem through packing rank
    three are proved in Lean. Triangle support, canonical splitting, and the
    exact isolated-K4 and fat-head-crown reductions are also proved, including
    preservation of the packing number, transversal projection, split
    normality, and the strict-counterexample kernel assembly. The discharge is
    formal through the labelled-edge count, connected-component size bound,
    packing-triangle classification, and crown-side outside-vertex lemmas.
    Hall deficiency is reduced to a minimal deficient core, matched back, and
    packaged as the exact nonempty fat-head crown structure. The residual
    zero-vertex domain is proved independent. Component transfer and the two
    residual-zero spanner statements remain, as do 65 certificate imports,
    the semantic graph-to-certificate translation, and the final rank-four
    theorem. The stronger K4-free nu=4, tau<=7 statement is intentionally
    outside scope.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: ["sorryAx"]
  main_results:
    - "SimpleGraph.tuza_rank_four"

automation:
  methods:
    - method: "agent"
      models: ["ChatGPT 5.6 Sol", "Claude Fable 5"]
      framework: "Codex and Claude"
      tool_setup: >-
        AI-assisted mathematical research, exposition, exact computation,
        certificate engineering, and Lean development; all generated claims
        are subject to kernel, certificate, and human review.
      cost:
        wall_time: "ongoing"
        spend_usd: "subscription-based; not separately tracked"
        hardware: "local Windows workstation and GitHub Actions"
      prompting_notes: >-
        Agents were instructed to preserve the exact finite-simple-graph
        statement, separate analytic and finite proof obligations, avoid
        unproved axioms, and satisfy Palomar's Comparator boundary.
  spend_usd: "subscription-based; not separately tracked"
  notes: >-
    Samuel Masse directs the work and is responsible for the theorem and
    artifact. AI systems are credited as assistance, not as responsible
    mathematical authors.

fidelity:
  divergences: >-
    No statement divergence is intended. Finite edges and triangles are
    represented as two- and three-element cliques. The stronger K4-free
    tau<=7 claim in the wider research dossier is not formalized here.

review:
  status: "self-assessed; independent expert review pending"
  reviewers:
