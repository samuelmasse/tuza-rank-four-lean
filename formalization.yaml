# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Tuza's Conjecture for Packing Number at Most Four"
  description: >-
    A Lean formalization of the theorem that every finite simple graph with at
    most four pairwise edge-disjoint triangles has an edge set meeting every
    triangle whose cardinality is at most twice the maximum packing size.
  authors:
    - "Samuel Masse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Samuel Masse"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C70"]

sources:
  - title: "Tuza's Conjecture for Graphs with at Most Four Edge-Disjoint Triangles"
    authors:
      - "Samuel Masse"
    id: "sha256:00e91f28a80c21814e72f98f8cab37e68fb11e53f7c03705304a898da09adc9f"
    type: "original-proof"
    relationship: "other"
    note: >-
      Publication-form manuscript dated 2026-08-24. The formalization targets
      its main theorem and excludes the separate stronger K4-free statement.
  - title: "A conjecture on triangles of graphs"
    authors:
      - "Zsolt Tuza"
    id: "doi:10.1007/BF01787705"
    type: "paper"
    location: "https://doi.org/10.1007/BF01787705"
    relationship: "background"
  - title: "New bounds on a generalization of Tuza's conjecture"
    authors:
      - "Alex Parker"
    id: "doi:10.37236/13355"
    type: "paper"
    location: "https://doi.org/10.37236/13355"
    relationship: "background"
  - title: "Kernelization for edge triangle packing and covering via a discharging method"
    authors:
      - "Zimo Sheng"
      - "Mingyu Xiao"
    id: "doi:10.1016/j.tcs.2024.114635"
    type: "paper"
    location: "https://doi.org/10.1016/j.tcs.2024.114635"
    relationship: "background"
  - title: "Trimming while checking clausal proofs"
    authors:
      - "Marijn J. H. Heule"
      - "Warren A. Hunt Jr."
      - "Nathan Wetzler"
    id: "doi:10.1007/978-3-319-09284-3_31"
    type: "paper"
    location: "https://doi.org/10.1007/978-3-319-09284-3_31"
    relationship: "background"

related_formalizations: []

status:
  scope: >-
    Complete proof of the exact finite-simple-graph statement. The development
    formalizes Parker's theorem through packing rank three, triangle-support
    and splitting reductions, exact isolated-K4 and fat-head-crown offsets, the
    twelve-vertex discharge, canonical classification of marked four-packings,
    the graph-to-CNF semantic bridge, and the dispatch over all 66 finite cases.
    Lean reconstructs all 331,430 semantic cuts and kernel-checks 572 LRAT
    segments refuting the 66 final formulas. The stronger K4-free nu=4,
    tau<=7 statement is intentionally outside scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SimpleGraph.tuza_rank_four"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "SimpleGraph.no_supported_rank_four_counterexample"
      file: "TuzaRankFour/FiniteEndpoint.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["ChatGPT 5.6 Sol", "Claude Fable 5"]
      framework: "Codex and Claude"
      tool_setup: >-
        AI-assisted mathematical research, exposition, exact computation,
        certificate engineering, and Lean development; all generated claims
        are subject to kernel, certificate, and human review.
      cost:
        wall_time: "multi-day development; exact elapsed time not tracked"
        spend_usd: "subscription-based; not separately tracked"
        hardware: "local Windows workstation and GitHub Actions"
      prompting_notes: >-
        Agents were instructed to preserve the exact finite-simple-graph
        statement, separate analytic and finite proof obligations, avoid
        unproved axioms, and satisfy Palomar's Comparator boundary.
  spend_usd: "subscription-based; not separately tracked"
  notes: >-
    Samuel Masse directs the work and is responsible for the theorem and
    artifact. AI systems are credited as assistance, not as responsible
    mathematical authors. The sorry count applies to Solution and its imported
    proof development; Challenge contains the single deliberate theorem hole
    required by the Palomar Challenge/Solution comparison format.

fidelity:
  divergences: >-
    No statement divergence is intended. Finite edges and triangles are
    represented as two- and three-element cliques. The stronger K4-free
    tau<=7 claim in the wider research dossier is not formalized here.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The complete development builds locally. Its axiom report contains only
    propext, Classical.choice, and Quot.sound. The manuscript has internal
    hostile and independent-verification records. A clean Linux replay,
    Palomar Comparator/NanoDa check, and independent human review remain release
    gates.

alignment:
  namespace: "SimpleGraph"
  statements:
    - source: "Main theorem of the 2026-08-24 manuscript"
      lean: "SimpleGraph.tuza_rank_four"
      module: "Challenge"
      status: "complete"
      note: >-
        The Lean declaration is the exact inequality tau(G) <= 2 nu(G) under
        nu(G) <= 4 for arbitrary finite simple graphs. Solution provides a
        placeholder-free proof of this declaration.

acknowledgements: >-
  Samuel Masse thanks the Mathlib community and the Palomar Registry project.
  ChatGPT 5.6 Sol (OpenAI) and Claude Fable 5 (Anthropic) assisted with
  research, exposition, software, and formalization.
