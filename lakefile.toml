name = "TuzaRankFour"
version = "0.1.0"
# A bare `lake build` is the quick contributor check.  The complete theorem
# replay is intentionally explicit because its checked certificates produce
# tens of GiB of build artifacts and take longer than a hosted CI job permits.
defaultTargets = ["Challenge"]
weakLeanArgs = ["-j", "1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "TuzaRankFour"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

